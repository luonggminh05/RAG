[project]
name = "rag-python-service"
version = "0.1.0"
description = "Python FastAPI Backend RAG & Multimodal AI Service với DDD Enterprise Architecture"
readme = "../docs/deployment_guide.md"
requires-python = ">=3.11, <3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "sse-starlette>=2.0.0",
  "httpx>=0.27.0",
  "pyodbc>=5.1.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.30",
  "cachetools>=5.3.0",
  "python-multipart>=0.0.9",
  "PyMuPDF>=1.24.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1.0",
  "Pillow>=10.2.0",
  "openai>=1.14.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "pytesseract>=0.3.10",
  "tiktoken>=0.5.0",
  "underthesea>=6.8.0",
  "markitdown>=0.1.0",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 30001"
test = "python tests/test_verify.py"
