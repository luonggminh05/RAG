version: '3.8'

services:
  rag-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-ai-service
    ports:
      - "30001:30001"
    environment:
      - RAG_API_REQUIRED_API_KEY=rag-internal-key-change-me
      - UPRAG_LMSTUDIOENDPOINT=http://192.168.18.1:1224/v1
      - UPRAG_MODELID=qwen2.5-vl-7b-instruct
      - UPRAG_APIKEY=EMPTY
      - TEI_URL=http://tei-embedding:8080
      - SQLSERVER_CONNECTIONSTRING=Driver={ODBC Driver 18 for SQL Server};Server=sql-server;Database=RagVectorDb;User Id=sa;Password=REPLACE_WITH_YOUR_SQL_SA_PASSWORD;TrustServerCertificate=True;Encrypt=Optional;
      - INGESTION_CHUNKSIZE=600
      - INGESTION_CHUNKOVERLAP=100
      - INGESTION_BATCHSIZE=32
      - INGESTION_ENABLEOCR=true
      - INGESTION_ENABLEVISIONCAPTION=true
      - INGESTION_VISIONAPIURL=http://192.168.18.1:1224/v1/chat/completions
      - INGESTION_VISIONAPIKEY=lm-studio
      - INGESTION_VISIONMODEL=qwen2.5-vl-7b-instruct
      - INGESTION_TESSDATAPATH=/usr/share/tesseract-ocr/4.00/tessdata
    restart: always
    depends_on:
      - tei-embedding

  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: tei-embedding
    ports:
      - "8080:80"
    command: --model-id BAAI/bge-m3
    resources:
      limits:
        cpus: '4'
        memory: 4G
    restart: always

# Note: SQL Server and vLLM / LM Studio are typically running on the host OS
# or external servers, but can be added to the network.
# Change UPRAG_LMSTUDIOENDPOINT and SQLSERVER_CONNECTIONSTRING to match your actual server IPs.
