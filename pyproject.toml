[project]
name = "rag-service"
version = "1.0.0"
description = "Python FastAPI RAG & Multimodal AI Service với DDD Clean Architecture và Giao diện Claude Cosmic UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "pyodbc>=5.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "cachetools>=5.3.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "pillow>=10.2.0",
    "openai>=1.14.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "pytesseract>=0.3.10",
    "tiktoken>=0.5.0",
    "underthesea>=6.8.0",
    "markitdown>=0.1.0",
    "langfuse>=4.15.1",
    "rich>=15.0.0",
    "pytest>=9.1.1",
    "langfuse-langchain>=2.60.10.1",
]

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
