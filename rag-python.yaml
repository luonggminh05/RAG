apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-python-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-python-service
  template:
    metadata:
      labels:
        app: rag-python-service
    spec:
      containers:
        - name: rag-python-service
          image: rag_api_python:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 30001
          env:
            - name: RAG_API_REQUIRED_API_KEY
              value: "rag-internal-key-change-me"
            - name: TEI_URL
              value: "http://embedding-server:80"
            - name: UPRAG_LMSTUDIOENDPOINT
              value: "http://192.168.18.1:1224/v1"
            - name: UPRAG_MODELID
              value: "qwen2.5-vl-7b-instruct"
            - name: UPRAG_APIKEY
              value: "EMPTY"
            - name: SQLSERVER_CONNECTIONSTRING
              valueFrom:
                secretKeyRef:
                  name: ragapi-sql-secret
                  key: connection-string
            - name: INGESTION_ENABLEOCR
              value: "true"
            - name: INGESTION_ENABLEVISIONCAPTION
              value: "true"
            - name: INGESTION_VISIONAPIURL
              value: "http://192.168.18.1:1224/v1/chat/completions"
            - name: INGESTION_VISIONAPIKEY
              value: "lm-studio"
            - name: INGESTION_VISIONMODEL
              value: "qwen2.5-vl-7b-instruct"
            - name: INGESTION_TESSDATAPATH
              value: "/usr/share/tesseract-ocr/5/tessdata"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: rag-python-service
spec:
  type: NodePort
  selector:
    app: rag-python-service
  ports:
    - protocol: TCP
      port: 30001
      targetPort: 30001
      nodePort: 30001
